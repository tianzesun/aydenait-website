[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Every route is prerendered to its own .html file (scripts/prerender.mjs), so anything
# else is a genuine 404. Netlify only applies this when no file matches the path.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    # style-src needs 'unsafe-inline' for React and framer-motion inline styles.
    # Add a source here before loading any new third-party script, font, image or API.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"

[functions]
  node_bundler = "esbuild"
