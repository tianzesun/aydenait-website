<!doctype html>
<html lang="en">

    <!-- Primary Meta Tags -->
    <title>AydenAIT - AI Solutions for Education and Beyond</title>

    <meta property="og:url" content="https://aydenait.com/" />
    <meta property="og:title" content="AydenAIT - AI Solutions for Education and Beyond" />

    <meta name="twitter:title" content="AydenAIT - AI Solutions for Education and Beyond" />
